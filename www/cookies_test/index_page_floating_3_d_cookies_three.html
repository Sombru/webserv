<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Floating Cookies • three.js</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: radial-gradient(ellipse at center, #2b2b2b 0%, #101010 100%); }
    #app { position: fixed; inset: 0; }
    .hud { position: fixed; left: 12px; bottom: 12px; color: #eee; font: 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; opacity: .75; }
    .hud a { color: #ddd; text-decoration: none; border-bottom: 1px dotted #777; }
  </style>
  <!-- Three.js CDN -->
  </head>
<body>
  <div id="app"></div>
  <div class="hud">🍪 Cookies drift in 3D. Scroll or resize to see parallax.
  </div>

  <!-- Using ES Modules import for three.js to avoid global 'THREE' issues -->
  <script type="module">
  import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';

  // Show any errors prominently
  window.addEventListener('error', (e) => {
    const el = document.createElement('pre');
    el.textContent = 'Error: ' + e.message;
    el.style.cssText = 'position:fixed;top:10px;left:10px;background:#300;color:#f88;padding:8px 10px;border-radius:8px;z-index:9999;max-width:60vw;white-space:pre-wrap;';
    document.body.appendChild(el);
  });

  // ====== Cookie texture: drawn procedurally on a hidden <canvas> (no external assets) ======
  function makeCookieTexture(size = 256) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');

    const r = size * 0.45;
    ctx.translate(size/2, size/2);

    const grd = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r);
    grd.addColorStop(0, '#cda56d');
    grd.addColorStop(1, '#8a5f2f');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < 120; i++) {
      const ang = Math.random() * Math.PI * 2;
      const rr = (Math.random() ** 0.7) * (r * 0.9);
      const x = Math.cos(ang) * rr;
      const y = Math.sin(ang) * rr;
      const dot = 1 + Math.random() * 2;
      ctx.fillStyle = `rgba(0,0,0,${0.05 + Math.random()*0.05})`;
      ctx.beginPath();
      ctx.arc(x, y, dot, 0, Math.PI*2);
      ctx.fill();
    }

    function chip(x, y, rad) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate((Math.random()-0.5)*0.6);
      const grd = ctx.createRadialGradient(0, 0, rad*0.3, 0, 0, rad);
      grd.addColorStop(0, '#3b2416');
      grd.addColorStop(1, '#140b06');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(-rad, 0);
      ctx.quadraticCurveTo(0, -rad*1.2, rad, 0);
      ctx.quadraticCurveTo(0, rad*0.9, -rad, 0);
      ctx.fill();
      ctx.restore();
    }
    for (let i = 0; i < 18; i++) {
      const ang = Math.random() * Math.PI * 2;
      const rr = (Math.random() ** 0.9) * (r * 0.8);
      const x = Math.cos(ang) * rr;
      const y = Math.sin(ang) * rr;
      chip(x, y, 6 + Math.random()*6);
    }

    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 4;
    tex.generateMipmaps = true;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    return tex;
  }

  // ====== Scene setup ======
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x101010, 1);
  document.getElementById('app').appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0f0f0f, 0.02);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(0, 0, 40);

  const light = new THREE.DirectionalLight(0xffffff, 0.6);
  light.position.set(1, 1, 1);
  scene.add(light);

  // ====== Cookie sprites ======
  const cookieTex = makeCookieTexture(256);
  const COUNT = 200;
  const DEPTH = 120;  // total z span
  const HALF = DEPTH / 2;
  const AREA = 40;

  const cookies = [];
  const group = new THREE.Group();
  scene.add(group);

  for (let i = 0; i < COUNT; i++) {
    const mat = new THREE.SpriteMaterial({ map: cookieTex, transparent: true, depthWrite: false });
    const sprite = new THREE.Sprite(mat);
    const size = 0.8 + Math.pow(Math.random(), 1.6) * 7.0;
    sprite.scale.set(size, size, 1);

    // Ensure most cookies are in front of camera (z < camera.position.z)
    sprite.position.set(
      (Math.random() - 0.5) * AREA * 2,
      (Math.random() - 0.5) * AREA * 2,
      -HALF + Math.random() * DEPTH - 20 // center nearer to camera
    );

    const speedBase = 0.02 + Math.random() * 0.08;
    const dir = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
    const depthFactor = THREE.MathUtils.mapLinear(sprite.position.z, -HALF, HALF, 1.2, 0.4);
    const velocity = dir.multiplyScalar(speedBase * depthFactor);

    const spin = (Math.random()-0.5) * 0.01;
    group.add(sprite);
    cookies.push({ sprite, velocity, spin });
  }

  function wrap(v, min, max) {
    const range = max - min;
    if (v < min) v += range;
    else if (v > max) v -= range;
    return v;
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', onResize);

  let mouseX = 0, mouseY = 0;
  window.addEventListener('mousemove', (e) => {
    const nx = (e.clientX / window.innerWidth) * 2 - 1;
    const ny = (e.clientY / window.innerHeight) * 2 - 1;
    mouseX = nx; mouseY = ny;
  });

  const clock = new THREE.Clock();
  function animate() {
    const dt = Math.min(clock.getDelta(), 0.033);

    camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
    camera.position.y += (-mouseY * 2 - camera.position.y) * 0.05;
    camera.lookAt(0, 0, 0);

    for (const c of cookies) {
      const s = c.sprite;
      s.position.addScaledVector(c.velocity, dt * 60);
      s.material.opacity = THREE.MathUtils.clamp(0.35 + (30 - Math.abs(s.position.z)) / 30, 0.25, 1);
      s.material.rotation += c.spin;

      const B = AREA;
      s.position.x = wrap(s.position.x, -B, B);
      s.position.y = wrap(s.position.y, -B, B);
      s.position.z = wrap(s.position.z, -HALF, HALF);
    }

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();

  window.addEventListener('click', () => {
    for (let i = 0; i < 12; i++) {
      const mat = new THREE.SpriteMaterial({ map: makeCookieTexture(256), transparent: true, depthWrite: false });
      const s = new THREE.Sprite(mat);
      const size = 1 + Math.random()*5;
      s.scale.set(size, size, 1);
      s.position.copy(camera.position).add(new THREE.Vector3((Math.random()-0.5)*4, (Math.random()-0.5)*4, -6 - Math.random()*8));
      const v = new THREE.Vector3((Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.2)).normalize().multiplyScalar(0.12 + Math.random()*0.12);
      const spin = (Math.random()-0.5) * 0.02;
      group.add(s);
      cookies.push({ sprite: s, velocity: v, spin });
    }
  });
  </script>

  <!-- Fallback for environments that disallow module scripts. If you still see a black screen, your network may be blocking the CDN. Try running a local server and check the devtools console. -->
  <script nomodule>
    document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;left:12px;top:12px;background:#222;color:#eee;padding:8px 10px;border-radius:8px">This browser blocks ES Modules. Try a modern browser.</div>');
  </script>
</body>
</html>
