<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Cookie Vault Login</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		:root {
			color-scheme: light dark;
			--bg: #0e101c;
			--fg: #fdf8ef;
			--muted: rgba(253, 248, 239, 0.72);
			--accent: #ffb347;
			--accent-2: #ff6b6b;
			--card: rgba(15, 17, 31, 0.78);
			--border: rgba(255, 255, 255, 0.18);
			--shadow: 0 26px 70px rgba(6, 8, 20, 0.65);
		}
		* {
			box-sizing: border-box;
		}
		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
			background: radial-gradient(130% 130% at 50% 0%, #2d1f46 0%, var(--bg) 70%);
			color: var(--fg);
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			position: relative;
		}
		canvas#cookie-field {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			z-index: 0;
		}
		main {
			position: relative;
			z-index: 1;
			width: min(420px, calc(100% - 32px));
			background: var(--card);
			border-radius: 28px;
			padding: 38px 34px 42px;
			box-shadow: var(--shadow);
			border: 1px solid var(--border);
			backdrop-filter: blur(14px);
			display: grid;
			gap: 24px;
		}
		header {
			display: grid;
			gap: 12px;
			text-align: center;
		}
		header h1 {
			margin: 0;
			font-size: clamp(2rem, 6vw, 2.6rem);
			letter-spacing: 0.03em;
		}
		header p {
			margin: 0;
			color: var(--muted);
			line-height: 1.6;
		}
		form {
			display: grid;
			gap: 18px;
		}
		label span {
			display: inline-block;
			margin-bottom: 6px;
			font-weight: 600;
			letter-spacing: 0.03em;
		}
		input[type="text"],
		input[type="password"] {
			width: 100%;
			padding: 12px 14px;
			border-radius: 14px;
			border: 1px solid rgba(255, 255, 255, 0.2);
			background: rgba(18, 20, 36, 0.8);
			color: var(--fg);
			font-size: 1rem;
		}
		input:focus-visible {
			outline: none;
			border-color: rgba(255, 179, 71, 0.8);
			box-shadow: 0 0 0 3px rgba(255, 179, 71, 0.25);
		}
		button {
			width: 100%;
			padding: 12px 18px;
			border-radius: 999px;
			border: none;
			font-weight: 600;
			font-size: 1rem;
			background: linear-gradient(120deg, var(--accent), #ffd56f);
			color: #2a1a15;
			cursor: pointer;
			transition: transform 0.18s ease, box-shadow 0.18s ease;
			box-shadow: 0 18px 38px rgba(255, 179, 71, 0.35);
		}
		button:hover,
		button:focus-visible {
			transform: translateY(-2px);
		}
		.error {
			color: var(--accent-2);
			font-weight: 600;
			min-height: 1.2em;
			text-align: center;
		}
		.footer-note {
			text-align: center;
			color: var(--muted);
			font-size: 0.95rem;
		}
		.footer-note a {
			color: var(--accent);
			font-weight: 600;
			text-decoration: none;
		}
		@media (max-width: 520px) {
			main {
				padding: 32px 24px 36px;
			}
		}
	</style>
</head>
<body>
	<canvas id="cookie-field" aria-hidden="true"></canvas>
	<main>
		<header>
			<h1>Cookie Vault</h1>
			<p>Access the secret jar. Use your credentials to continue.</p>
		</header>
		<form action="/login" method="POST" autocomplete="on">
			<label for="username">
				<span>Username</span>
				<input type="text" id="username" name="username" placeholder="CookieMaster" required>
			</label>
			<label for="password">
				<span>Password</span>
				<input type="password" id="password" name="password" placeholder="********" required>
			</label>
			<button type="submit">Enter the vault</button>
		</form>
		<div id="error-message" class="error"></div>
		<div class="footer-note">
			Suspicious crumb? <a href="/">Head back home</a>.
		</div>
	</main>

	<script type="module">
		const canvas = document.getElementById("cookie-field");

		const fallbackCookies = () => {
			const layer = document.createElement("div");
			layer.style.position = "fixed";
			layer.style.inset = "0";
			layer.style.pointerEvents = "none";
			layer.style.overflow = "hidden";
			layer.style.zIndex = "0";
			document.body.appendChild(layer);

			const sprites = ["(cookie)", "[treat]", "{sweet}"];
			for (let i = 0; i < 24; i++) {
				const span = document.createElement("span");
				span.textContent = sprites[i % sprites.length];
				const size = 32 + Math.random() * 48;
				span.style.position = "absolute";
				span.style.left = Math.random() * 100 + "%";
				span.style.top = Math.random() * 100 + "%";
				span.style.fontSize = size + "px";
				span.style.filter = "drop-shadow(0 6px 12px rgba(0,0,0,0.25))";
				span.style.opacity = "0";
				span.style.animation = `floatCookie ${8 + Math.random() * 6}s ease-in-out infinite`;
				span.style.animationDelay = (-Math.random() * 8) + "s";
				layer.appendChild(span);
			}
		};

		if (!canvas) {
			console.warn("cookie-field canvas not found; using fallback animation.");
			fallbackCookies();
		} else {
			try {
				const THREE = await import("https://unpkg.com/three@0.161.0/build/three.module.js");
				const {
					WebGLRenderer,
					Scene,
					FogExp2,
					PerspectiveCamera,
					AmbientLight,
					DirectionalLight,
					CanvasTexture,
					SpriteMaterial,
					Sprite,
					Group,
					Vector3,
					MathUtils,
					Clock
				} = THREE;

				const renderer = new WebGLRenderer({ canvas, antialias: true, alpha: true });
				renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
				renderer.setSize(window.innerWidth, window.innerHeight);
				renderer.setClearColor(0x101010, 0);

				const scene = new Scene();
				scene.fog = new FogExp2(0x0f0f0f, 0.024);

				const camera = new PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
				camera.position.set(0, 0, 40);

				const ambient = new AmbientLight(0xfff3df, 0.5);
				scene.add(ambient);
				const light = new DirectionalLight(0xffffff, 0.6);
				light.position.set(1, 1.2, 1);
				scene.add(light);

				const makeCookieTexture = (size = 256) => {
					const texCanvas = document.createElement("canvas");
					texCanvas.width = texCanvas.height = size;
					const ctx = texCanvas.getContext("2d");

					const radius = size * 0.45;
					ctx.translate(size / 2, size / 2);

					const gradient = ctx.createRadialGradient(0, 0, radius * 0.2, 0, 0, radius);
					gradient.addColorStop(0, "#cda56d");
					gradient.addColorStop(1, "#8a5f2f");
					ctx.fillStyle = gradient;
					ctx.beginPath();
					ctx.arc(0, 0, radius, 0, Math.PI * 2);
					ctx.fill();

					for (let i = 0; i < 120; i++) {
						const angle = Math.random() * Math.PI * 2;
						const dist = Math.pow(Math.random(), 0.7) * radius * 0.9;
						const x = Math.cos(angle) * dist;
						const y = Math.sin(angle) * dist;
						const dot = 1 + Math.random() * 2;
						ctx.fillStyle = `rgba(0,0,0,${0.05 + Math.random() * 0.05})`;
						ctx.beginPath();
						ctx.arc(x, y, dot, 0, Math.PI * 2);
						ctx.fill();
					}

					const drawChip = (x, y, rad) => {
						ctx.save();
						ctx.translate(x, y);
						ctx.rotate((Math.random() - 0.5) * 0.6);
						const chipGrad = ctx.createRadialGradient(0, 0, rad * 0.3, 0, 0, rad);
						chipGrad.addColorStop(0, "#3b2416");
						chipGrad.addColorStop(1, "#140b06");
						ctx.fillStyle = chipGrad;
						ctx.beginPath();
						ctx.moveTo(-rad, 0);
						ctx.quadraticCurveTo(0, -rad * 1.2, rad, 0);
						ctx.quadraticCurveTo(0, rad * 0.9, -rad, 0);
						ctx.fill();
						ctx.restore();
					};

					for (let i = 0; i < 18; i++) {
						const angle = Math.random() * Math.PI * 2;
						const dist = Math.pow(Math.random(), 0.9) * radius * 0.8;
						const x = Math.cos(angle) * dist;
						const y = Math.sin(angle) * dist;
						drawChip(x, y, 6 + Math.random() * 6);
					}

					const texture = new CanvasTexture(texCanvas);
					texture.anisotropy = 4;
					texture.generateMipmaps = true;
					texture.minFilter = THREE.LinearMipmapLinearFilter;
					return texture;
				};

				const baseTexture = makeCookieTexture(256);
				const COUNT = 180;
				const DEPTH = 120;
				const HALF = DEPTH / 2;
				const AREA = 36;

				const group = new Group();
				scene.add(group);
				const cookies = [];

				for (let i = 0; i < COUNT; i++) {
					const material = new SpriteMaterial({ map: baseTexture, transparent: true, depthWrite: false });
					const sprite = new Sprite(material);
					const size = 0.8 + Math.pow(Math.random(), 1.6) * 6.0;
					sprite.scale.set(size, size, 1);
					sprite.position.set(
						(Math.random() - 0.5) * AREA * 2,
						(Math.random() - 0.5) * AREA * 2,
						-HALF + Math.random() * DEPTH - 20
					);

					const speedBase = 0.02 + Math.random() * 0.08;
					const direction = new Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
					const depthFactor = MathUtils.mapLinear(sprite.position.z, -HALF, HALF, 1.3, 0.4);
					const velocity = direction.multiplyScalar(speedBase * depthFactor);
					const spin = (Math.random() - 0.5) * 0.02;

					group.add(sprite);
					cookies.push({ sprite, velocity, spin });
				}

				const wrap = (value, min, max) => {
					const range = max - min;
					if (value < min) return value + range;
					if (value > max) return value - range;
					return value;
				};

				const onResize = () => {
					const width = window.innerWidth;
					const height = window.innerHeight;
					camera.aspect = width / height;
					camera.updateProjectionMatrix();
					renderer.setSize(width, height);
				};

				window.addEventListener("resize", onResize);

				let mouseX = 0;
				let mouseY = 0;
				window.addEventListener("mousemove", (event) => {
					mouseX = (event.clientX / window.innerWidth) * 2 - 1;
					mouseY = (event.clientY / window.innerHeight) * 2 - 1;
				});

				const clock = new Clock();
				const animate = () => {
					const dt = Math.min(clock.getDelta(), 0.033);

					camera.position.x += (mouseX * 3 - camera.position.x) * 0.05;
					camera.position.y += (-mouseY * 3 - camera.position.y) * 0.05;
					camera.lookAt(0, 0, 0);

					for (const cookie of cookies) {
						cookie.sprite.position.addScaledVector(cookie.velocity, dt * 60);
						cookie.sprite.material.opacity = MathUtils.clamp(0.35 + (30 - Math.abs(cookie.sprite.position.z)) / 30, 0.2, 1);
						cookie.sprite.material.rotation += cookie.spin;
						const bounds = AREA;
						cookie.sprite.position.x = wrap(cookie.sprite.position.x, -bounds, bounds);
						cookie.sprite.position.y = wrap(cookie.sprite.position.y, -bounds, bounds);
						cookie.sprite.position.z = wrap(cookie.sprite.position.z, -HALF, HALF);
					}

					renderer.render(scene, camera);
					requestAnimationFrame(animate);
				};

				window.addEventListener("click", () => {
					for (let i = 0; i < 12; i++) {
						const material = new SpriteMaterial({ map: makeCookieTexture(256), transparent: true, depthWrite: false });
						const sprite = new Sprite(material);
						const size = 1 + Math.random() * 4;
						sprite.scale.set(size, size, 1);
						sprite.position.copy(camera.position).add(new Vector3((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4, -6 - Math.random() * 8));
						const velocity = new Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.2).normalize().multiplyScalar(0.12 + Math.random() * 0.12);
						const spin = (Math.random() - 0.5) * 0.03;
						group.add(sprite);
						cookies.push({ sprite, velocity, spin });
					}
				});

				onResize();
				requestAnimationFrame(animate);
			} catch (error) {
				console.error("Three.js background failed:", error);
				fallbackCookies();
			}
		}
	</script>
	<style>
		@keyframes floatCookie {
			0% {
				transform: translate3d(-10px, 20px, 0) scale(0.8);
				opacity: 0;
			}
			20% {
				opacity: 1;
			}
			50% {
				transform: translate3d(10px, -20px, 0) scale(1.15);
			}
			80% {
				opacity: 1;
			}
			100% {
				transform: translate3d(-15px, 25px, 0) scale(0.7);
				opacity: 0;
			}
		}
	</style>
	<script>
		const urlParams = new URLSearchParams(window.location.search);
		if (urlParams.get('error') === '1') {
			document.getElementById('error-message').textContent = 'Invalid username or password. Try again, crumb seeker.';
		}
	</script>
</body>
</html>
