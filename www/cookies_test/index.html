<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cookie Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff8f0;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #d2691e;
            text-shadow: 1px 1px #fff;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #fff;
            border: 2px solid #e5c49b;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
            transition: transform 0.15s ease-in-out;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card p {
            padding: 10px;
            font-size: 1em;
            color: #5a3e1b;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            color: #777;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>🍪 Cookie Gallery 🍪</h1>
    <div class="gallery">
        <div class="card">
            <img src="/images/choco_cookie.jpg" alt="Chocolate Cookie">
            <p>Chocolate Cookie</p>
        </div>
        <div class="card">
            <img src="/images/oatmeal_cookie.jpg" alt="Oatmeal Cookie">
            <p>Oatmeal Cookie</p>
        </div>
        <div class="card">
            <img src="/images/vanilla_cookie.jpg" alt="Vanilla Cookie">
            <p>Vanilla Cookie</p>
        </div>
        <div class="card">
            <img src="/images/peanut_cookie.jpg" alt="Peanut Cookie">
            <p>Peanut Cookie</p>
        </div>
        <div class="card">
            <img src="/images/fancy_cookie.jpg" alt="Fancy Cookie">
            <p>Fancy Cookie</p>
        </div>
    </div>
    <footer>
        <p>Welcome to the Fusion Web Cookie Gallery</p>
    </footer>
</body>
</html>
